{
  "mode": "paper",
  "broker": {
    "paper": true,
    "allow_live": false,
    "data_feed": "iex",
    "options_feed": "indicative"
  },
  "session": {
    "timezone": "America/New_York",
    "entries_regular_session_only": true,
    "allow_exits_outside_session": true,
    "force_flat_minutes_before_close": 10,
    "reject_new_entries_minutes_before_close": 5
  },
  "universe": {
    "symbols": ["SPY", "QQQ", "IWM", "DIA"],
    "asset_classes": ["us_equity", "us_option"],
    "min_price": 1.0,
    "max_symbols": 50,
    "denylist": []
  },
  "strategy": {
    "id": "rule",
    "version": "v1",
    "variant_id": "auto",
    "selection_mode": "all_proved",
    "execution_mode": "shares",
    "range_minutes": 15,
    "breakout_buffer_bps": 5,
    "min_relative_volume": 1.0,
    "target_r": 2.0,
    "max_entry_extension_r": 1.0,
    "min_ibr_width_atr": 0.25,
    "max_ibr_width_atr": 3.0,
    "latest_entry_time": "15:00",
    "force_flat_minutes_before_close": 10
  },
  "risk": {
    "risk_per_trade_pct": 0.5,
    "daily_loss_limit_pct": 2.0,
    "max_open_risk_pct": 2.0,
    "max_concurrent_positions": 3,
    "max_position_notional_pct": 25.0,
    "options_min_dte": 7,
    "options_max_dte": 60,
    "options_max_spread_pct": 10.0
  },
  "execution": {
    "order_type": "market",
    "time_in_force": "day",
    "client_order_id_prefix": "edge",
    "max_slippage_bps": 50,
    "max_market_data_age_seconds": 30,
    "max_spread_bps": 100
  },
  "llm": {
    "enabled": false,
    "provider": "openai",
    "model": "",
    "temperature": 0.2,
    "max_tokens": 2000,
    "timeout_seconds": 10
  },
  "research": {
    "enabled": true,
    "require_validated_variant": true,
    "champion_min_confidence": 0.95,
    "strategy_llm": {
      "enabled": true,
      "provider": "openai",
      "model": "gpt-5",
      "max_attempts": 2,
      "timeout_seconds": 30,
      "max_response_bytes": 16384
    },
    "proof": {
      "directory": "research/results/edges",
      "webhook_url": "",
      "webhook_timeout_seconds": 10
    }
  },
  "cycle": {
    "interval_seconds": 60
  }
}
