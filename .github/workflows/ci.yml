name: test-and-container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the locked runtime
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Compile and run the complete test suite
        run: |
          python -m compileall -q agent research deploy main.py report.py research.py
          python -m unittest discover -v
      - name: Validate and build the Compose deployment
        run: |
          cp .env.example .env
          chmod 600 .env
          # compose.yaml deliberately declares the research provider secret as a
          # required variable with no default, so an operator cannot start the
          # autonomous lane with an unreadable key file. Validation therefore
          # has to supply one the way a real deployment does; the placeholder
          # is never used to reach a provider.
          printf 'OPENAI_API_KEY=ci-compose-validation-placeholder\n' > research-llm.env
          chmod 600 research-llm.env
          export ALPACA_RESEARCH_LLM_SECRET_FILE="$PWD/research-llm.env"
          docker compose config --quiet
          docker compose --profile research config --quiet
          docker compose build
      - name: Reject stale crypto-provider terms outside the deny boundary
        run: |
          if rg -n -i '\b(ccxt|usdt|funding|perpetual)\b' \
              agent deploy research tests README.md SETUP.md OPERATIONS.md \
              AZURE_DEPLOYMENT.md .env.example requirements.txt \
              requirements.lock.txt Dockerfile compose.yaml \
              --glob '*.py' --glob '*.md' --glob '*.yaml' --glob '*.yml' \
              --glob '*.sh' --glob '*.txt' --glob '!instruments.py'; then
            echo 'stale crypto-provider term found in active source/tests/docs' >&2
            exit 1
          fi
