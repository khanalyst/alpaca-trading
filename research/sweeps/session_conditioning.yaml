# Session conditioning: three economic windows, not twenty-four hourly buckets.
#
# The strategy rationale is explicit that this test is most likely to produce
# a false positive that survives scrutiny it has not earned: a session filter
# feels intuitive, so it will be believed. Twenty-four buckets against a few
# hundred trades will always produce a "significant" hour.
#
# Three constraints, all non-negotiable and all encoded here: economically
# motivated windows fixed before the query, a mandatory out-of-sample split,
# and a family-wise correction whose corrected figure is the only one any
# recommendation may quote.
hypothesis: >-
  Expectancy conditional on setup type is not uniform across the UTC day, and
  breakouts in thin-liquidity hours are disproportionately stop-runs.
base: momentum.baseline
condition_axis:
  variable: utc_hour
  pre_registered: true
  definition: >-
    UTC hour recorded in B0.5. Windows follow the documented diurnal cycle:
    realised volatility is lowest around 05:00 UTC and volume peaks in the
    European/US overlap.
  buckets:
    - name: asia
      min: 0
      max: 7
    - name: thin_hours
      min: 7
      max: 12
    - name: europe_us_overlap
      min: 12
      max: 21
    - name: off_hours
      min: 21
      max: 24
