# A parameter axis, registered but deliberately NOT scheduled.
#
# Per action-plan C5 this must not run until the funnel report is published.
# If the binding veto sits downstream of the strategy contract - and the
# first funnel run says it does - then no setting of fixed_reward_risk can
# change the trade count, and five replays would consume weeks to discover
# that the funnel narrows somewhere else.
hypothesis: >-
  A 2R fixed target is not optimal; the correct multiple is unknown and has
  never been measured against any alternative.
base: momentum.baseline
# The grid stops at 3.0 because config validation refuses a fixed target
# above extended_reward_risk, and a variant that cannot be validated is
# refused at registration rather than after a week of replay. Testing a 4R
# target means moving the extended multiple with it, which is a different
# hypothesis and belongs in its own spec.
axis:
  strategy.fixed_reward_risk: [1.5, 2.0, 2.5, 3.0]
