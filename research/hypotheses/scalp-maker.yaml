# Pre-registration: scalp-maker / v1
#
# Registered so the tournament reports WHY historical scoring is unavailable
# rather than silently skipping it. Real-time forward simulation is active;
# historical queue/fill evidence still does not exist.

strategy_id: scalp-maker
version: v1
status: registered_forward_only

mechanism: |
  A maker is paid the spread for supplying liquidity; the payer is the
  impatient taker who crosses it. This does not require predicting
  direction, which is why it is the one scalping design that is not
  arithmetically dead: round-trip taker cost alone (~0.10%) exceeds a
  typical 1-minute move on a major.

prediction: |
  Resting limit orders on tight-spread majors, filled inside ~10 bps of
  price penetration, earn the fee differential plus avoided entry slippage
  (~+0.105%) net of adverse selection.

falsification: |
  Recorded book state shows resting orders require more than ~10-15 bps of
  penetration to fill, at which point adverse selection exceeds the fee
  saving and the strategy is negative by construction. The existing maker
  study puts the crossover between 5 and 15 bps.

signal_timeframe: 1m
scalp_max_spread_pct: 0.02
scalp_min_abs_imbalance: 0.15
scalp_min_depth_usd: 10000
stop_atr_multiple: 0.5
reward_risk: 1.0
max_hold_hours: 4

settings:
  - id: registered
    params: {}
    claim: >-
      The shipped real-time book thresholds are the comparison point.
  - id: stronger_imbalance
    params:
      scalp_min_abs_imbalance: 0.25
    claim: >-
      Requiring a stronger depth imbalance should reduce adverse selection if
      imbalance is useful rather than merely descriptive.
  - id: tighter_spread
    params:
      scalp_max_spread_pct: 0.01
    claim: >-
      A tighter maximum spread tests whether only the most liquid books can
      support a passive-entry inventory trade.
  - id: very_strong_imbalance
    params:
      scalp_min_abs_imbalance: 0.35
    claim: >-
      A registered 0.35 imbalance point tests whether only the strongest
      observed book pressure compensates passive adverse selection.
  - id: very_tight_spread
    params:
      scalp_max_spread_pct: 0.005
    claim: >-
      A registered 0.005 percent spread point tests passive capture in the most
      liquid observed books.
  - id: penetration_5bps
    params:
      execution.paper_maker_fill_penetration_bps: 5
    claim: >-
      Requiring 5 bps of later trade-through tests the favorable side of the
      declared 5-to-15 bps fill crossover before adverse selection dominates.
  - id: penetration_15bps
    params:
      execution.paper_maker_fill_penetration_bps: 15
    claim: >-
      Requiring 15 bps of later trade-through tests the declared falsifier: if
      fills only appear beyond this crossover, adverse selection should erase
      the maker fee and spread advantage.

backtestable: false
why_not_backtestable: |
  Maker profitability is decided by fill quality, fill quality is decided by
  queue position, and queue position depends on order-book state that OKX
  has NEVER served historically. No amount of candle data recovers it.

  research/record_flow.py has been capturing 1-25 bps depth bands and
  book_span_bps since it was started. The first honest result is roughly
  three months after that point. Any number produced before then is a guess
  wearing a backtest's clothes.

  The forward evaluator can still paper-simulate the declared passive entry
  at an observed best quote. That is implementation evidence, not proof that
  a real resting order would have obtained queue priority or a fill.

hypotheses_tested: 7
multiple_testing_note: |
  Seven parameterisations are declared before forward outcomes are observed.
  No setting has completed the evidence window yet.

design_constraints_already_measured: |
  - Spread varies ~90x across the tradable universe (BTC 0.015 bps, DOGE
    1.39 bps), so this is a tight-spread majors-only design.
  - Depth is not the binding constraint at retail size: even thin names
    offer ~$20k within 25 bps against a ~$3k position from a $10k account.
  - execution.max_spread_pct is 15 bps, which is permissive enough that it
    never binds on majors - so it is not currently protecting anything and
    would need tightening for a maker design.
