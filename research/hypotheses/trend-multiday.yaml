# Pre-registration: trend-multiday / v1
# Written BEFORE the first run.

strategy_id: trend-multiday
version: v1
status: registered

mechanism: |
  Slow adoption flows and reflexive positioning make crypto trend persist at
  horizons measured in days. The payer is the mean-reversion seller who is
  early - someone who shorts strength because it "must" revert, and funds
  the continuation while waiting.

  The reason to test trend at this timescale rather than the 15m one is
  arithmetic, not preference. Round-trip cost is roughly 15% of a typical
  intraday move and roughly 1% of a multi-day one. An effect too small to
  survive one can survive the other unchanged.

prediction: |
  Entries aligned on both the 1h and 4h trend, taken in a calm volatility
  regime and away from the middle of the 24h range, produce positive
  expectancy net of costs when held for up to 14 days.

falsification: |
  Expectancy negative net of costs out-of-sample, or no better than the
  random-timing null. Also falsified if it only works in-sample, or if the
  placebo reaches 25% or more of the candidate.

signal_timeframe: 4h
min_range_pos_pct: 55.0
max_atr_ratio: 2.0
stop_atr_multiple: 2.0
reward_risk: 3.0
max_hold_bars: 1344        # 14 days
cost_scenarios: [frictionless, optimistic, base, realistic_alt, stress]

# Parameterizations
# Registered 2026-07-30, before this hypothesis has been scored at all - which
# is the right time to register them.
#
# The mechanism's claim is about HORIZON: cost falls from ~15% of a typical
# intraday move to ~1% of a multi-day one, so the hold is the parameter the
# claim actually rests on. Halving it is therefore the sharpest available test
# of the mechanism rather than of the strategy.
settings:
  - id: registered
    params: {}
    claim: >-
      The pre-registered 14-day hold at a 55% range-position floor.
  - id: half_horizon
    params:
      max_hold_bars: 672
    claim: >-
      If the edge is horizon economics, halving the hold to 7 days should cut
      expectancy roughly in proportion. If expectancy is unchanged, the hold is
      not where the return comes from and the mechanism is misstated.
  - id: stronger_trend
    params:
      min_range_pos_pct: 70.0
      max_atr_ratio: 1.5
    claim: >-
      Demanding a better-established trend in a calmer volatility regime should
      improve expectancy if persistence is real, at the cost of sample.
  - id: three_quarter_horizon
    params:
      max_hold_bars: 1008
    claim: >-
      A registered three-quarter horizon tests persistence between the
      fourteen-day baseline and half-horizon hold.

hypotheses_tested: 4
multiple_testing_note: |
  Four parameterisations are declared, including two single-axis horizons.

data_limitation: |
  A 14-day hold on a 200-day window yields few non-overlapping trades, so
  the detectability gate will likely cap this at T2 regardless of the sign.
  That cap is correct and is stated here in advance: a long-horizon strategy
  needs a long history, and this one does not have it yet.
