# Pre-registration: momentum / phase1-v2
#
# Registered retrospectively, as the benchmark null. This is the one entry
# here whose result is already known, and it is kept so that the tournament
# has something to calibrate against: if the harness cannot reproduce this
# strategy's measured failure, the harness is wrong.

strategy_id: momentum
version: phase1-v2
status: benchmark_null

mechanism: |
  None established. Retained as the null that any new strategy must beat.

prediction: |
  A completed 15m impulse aligned with the 1h and 4h trend continues far
  enough to reach a 3R target before a structure-anchored stop.

falsification: |
  Directional hit rate at or below 50% at every horizon, or expectancy
  negative out-of-sample net of costs.

outcome: falsified
outcome_evidence: research/results/edge-audit-2024-2026/REPORT.md
outcome_summary: |
  115,929 signals. Hit rate 45.6-47.3% at every horizon from 15m to 24h.
  -0.096 R at base costs, 95% CI [-0.135, -0.056], monthly t = -4.60. At
  zero cost, random entry timing (+0.018%) and the inverted signal (+0.021%)
  both beat following it (-0.046%). 0 of 79 walk-forward parameter variants
  positive out-of-sample.

signal_timeframe: 15m
horizons_bars: [96, 192]
exit_policies: [fixed_rr, extended_rr, structure_target]
cost_scenarios: [frictionless, optimistic, base, realistic_alt, stress]

hypotheses_tested: 79
multiple_testing_note: |
  79 pre-registered parameter variants scored on a purged walk-forward
  split. Share positive out-of-sample: 0.0%. There is no winner to discount.
