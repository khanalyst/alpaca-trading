# Pre-registration: funding-unwind / v1
#
# PROVENANCE, stated first because it is the most important fact about this
# hypothesis: it was GENERATED by decomposing funding-carry's result on the
# 2026-05..2026-07 window. The +1.969% price component was an observation
# made on that data, so any result this hypothesis produces on that same
# data is IN-SAMPLE BY CONSTRUCTION and cannot confirm it.
#
# This file exists so that fact travels with the number. Reporting the same
# +1.97% under a new name and calling it a discovery is precisely the
# retro-fitting the framework exists to prevent.

strategy_id: funding-unwind
version: v1
status: registered_in_sample_only

mechanism: |
  Extreme funding is a POSITIONING indicator, not a yield opportunity.

  When funding sits at the top of its own recent range, leveraged longs are
  crowded and are paying to stay in. Crowded leveraged positions are
  unstable: they are held by traders who need the move to continue in order
  to keep affording the position, and who are forced out when it does not.
  The unwind is a directional move against the crowd, and the payer is the
  crowded leveraged trader who is squeezed out of a position they could not
  finance.

  This is a DIFFERENT claim from funding-carry, which said the return source
  was the carry itself. That claim was falsified: funding contributed 2% of
  that strategy's result. This one says the opposite - the carry is
  incidental and the return comes from the price move as positioning
  unwinds. Same input series, opposite economics, and the attribution gate
  distinguishes them.

return_source: price

prediction: |
  Taking the side opposite crowded positioning, identified by funding
  percentile within an instrument's own 30-sample history, produces
  positive expectancy from PRICE movement, with funding contributing less
  than half the result.

falsification: |
  Any of:
  - funding contributes 50% or more of the result (then it is a carry
    trade after all, and funding-carry's rejection applies unchanged);
  - the effect does not survive on data outside 2026-05..2026-07, which is
    the window that generated it;
  - the placebo reaches 25% or more of the candidate;
  - it fails to beat the random-timing and random-direction nulls.

# --- exactly what will be tested -------------------------------------------
signal_timeframe: 1h
funding_extreme_pct_per_8h: 0.01
percentile: 80.0
min_samples: 20
stop_atr_multiple: 3.0
reward_risk: 2.0
max_hold_bars: 960
cost_scenarios: [frictionless, optimistic, base, realistic_alt, stress]

# --- the parameterisations that will be tested -----------------------------
# Registered 2026-07-30. The percentile is the whole hypothesis here: the claim
# is that funding measures POSITIONING, so the unwind should strengthen as
# positioning gets more crowded and weaken as it gets less. That is a
# monotonicity prediction, and a hypothesis that scores best at whichever
# percentile happens to be tried first is not making one.
#
# None of this can confirm anything on this window - the tier stays T1 by
# in_sample_by_construction regardless of how the settings come back.
settings:
  - id: registered
    params: {}
    claim: >-
      The pre-registered 80th-percentile crowding threshold inherited from
      funding-carry's decomposition.
  - id: extreme_crowding
    params:
      percentile: 95.0
      min_samples: 30
    claim: >-
      More crowded positioning should unwind harder. If expectancy does not
      rise, funding is not measuring positioning pressure here.
  - id: mild_crowding
    params:
      percentile: 60.0
    claim: >-
      Expectancy should fall towards the unconditional case as the crowding
      requirement relaxes. If it does not, the percentile is not the signal.

hypotheses_tested: 4
multiple_testing_note: |
  Counted as 2, not 1: funding-carry and funding-unwind are the same entry
  rule tested under two different mechanism claims. The entry has been
  looked at twice on this data, and the count says so.

data_limitation: |
  Funding coverage limits the usable window to roughly three months, in one
  market regime, with monthly expectancy that rose monotonically across it
  (+1.02%, +1.76%, +3.37%). Direction is lopsided: 24 longs at +5.95%
  against 92 shorts at +0.98%. Both are consistent with a regime artifact
  and neither can be resolved on this data.

what_would_change_the_verdict: |
  Out-of-sample data. Specifically: funding history from a period outside
  2026-05..2026-07, or enough forward shadow evidence to reach the trade
  count the detectability gate computes. Until one of those exists this
  stays at T1 regardless of how large the in-sample number is, and the
  tournament's sample-size cap enforces that independently.

# Machine-checkable provenance. The tournament caps this at T1 however
# clean the gates come back, because the gates measure the result and the
# result is what suggested the hypothesis.
in_sample_by_construction: true
