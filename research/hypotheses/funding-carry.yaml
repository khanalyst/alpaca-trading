# Pre-registration: funding-carry / v1
# Written BEFORE the first run.

strategy_id: funding-carry
version: v1
status: registered

mechanism: |
  Funding is the price of leverage. When positioning is crowded the crowd
  pays continuously to hold, and the payer is identifiable: the leveraged
  long in a persistently positive-funding regime, or the leveraged short
  when funding is negative.

  The return source is the carry itself rather than a directional forecast.
  That is the reason to prefer it: it does not need to be right about
  direction to be paid, which is the requirement the momentum contract
  failed.

  This is NOT the momentum strategy's funding_squeeze setup. That uses
  extreme funding as a reversal trigger over hours; this holds the
  funding-receiving side for days and collects settlements.

prediction: |
  Taking the funding-receiving side when the rate is both above an absolute
  floor and in the top of its own 30-sample range produces positive
  expectancy net of price risk and costs over multi-day holds.

falsification: |
  Positive carry does not survive the price risk taken to collect it -
  expectancy negative net of costs, or no better than random timing. Also
  falsified if it works only where funding is extreme because the
  instrument is thin, i.e. if the result disappears on liquid majors.

signal_timeframe: 1h
funding_extreme_pct_per_8h: 0.01
percentile: 80.0
min_samples: 20
stop_atr_multiple: 3.0
reward_risk: 2.0
max_hold_bars: 960         # 10 days
cost_scenarios: [frictionless, optimistic, base, realistic_alt, stress]

hypotheses_tested: 1
multiple_testing_note: |
  One parameter set, registered before the first run.

data_limitation: |
  OKX serves ~97 days of funding history; outside that window edge_lab
  charges each symbol its own median observed rate. Measured rates are
  ~0.002%/8h on majors, so the cells where this could pay are the ones
  where funding is pinned at its clamp - which are also the thinnest
  instruments. The falsification criterion above names that trap directly.

# The mechanism claims the carry is the return source. That claim is
# checkable, so it is declared here and the battery verifies it.
return_source: funding

# --- outcome, appended after the first run ---------------------------------
outcome: falsified_mechanism
outcome_evidence: research/results/tournament/REPORT.md
outcome_summary: |
  116 non-overlapping trades, 8 instruments, 2026-05 to 2026-07 (funding
  coverage limits the usable span to ~3 months).

  The headline number is large and survives most checks:

    base costs        +2.0079%
    out-of-sample     +3.7247%   better than in-sample (+1.4668%)
    placebo           -0.0767%   -4% of candidate
    beats every null  yes
    liquid majors     +1.2371%   does NOT disappear on majors

  The pre-registered "only works on thin instruments" trap was therefore
  NOT the failure mode. The failure mode was the mechanism itself.

  Decomposed by disabling funding in the simulator while holding fees,
  slippage and entries fixed:

    total              +2.0079%
    funding credited   +0.0391%    2% of the result
    price movement     +1.9689%   98% of the result

  The stated mechanism is "the return source is the carry itself rather
  than a directional forecast". It is not. This is a directional strategy
  that happens to be filtered by funding, and every number about it is
  true. Direction split is also lopsided: 24 longs at +5.95% against 92
  shorts at +0.98%, over three months in a single regime, with monthly
  expectancy rising monotonically (+1.02%, +1.76%, +3.37%).

outcome_caveat: |
  This did not fail because the result was small or fragile. It failed
  because we do not know why it pays, and a result whose source is not
  understood cannot be told apart from overfitting - nor will anyone notice
  when it stops working. That is the entire content of the "have a
  mechanism" requirement, and stating a mechanism that turns out to be the
  wrong one does not satisfy it.

  The gate that caught this (mechanism_is_the_source) was added because of
  this result. Every other gate passed.

what_would_justify_a_retest: |
  Two separate questions, and they need separate pre-registrations:

  1. Carry as a return source: test it with a design where carry can
     actually dominate - no price target, exit on the crowding unwinding
     rather than on an ATR multiple - and over more than three months of
     funding history.
  2. The residual +1.97% directional result: this is a NEW hypothesis, not
     this one. It needs its own mechanism explaining why funding percentile
     predicts direction, its own falsification criterion, and its own
     hypothesis count. Reporting it under this file would be exactly the
     retro-fitting this framework exists to prevent.
