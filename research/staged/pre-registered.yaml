# Hand-written pre-registrations, staged the same way an authored one is.
#
# The authoring loop (`research.py author`) generates mechanisms from what the
# evidence has already killed. This file is the human entry point to the same
# staging store, for claims that come out of analysis rather than out of the
# proposer. Everything here enters at T1_HYPOTHESIS exactly like an authored
# contract, is measured on the same fixed harness, and reaches capital only
# through the same reviewed packet a human signs. `author` is set on each
# entry so the two sources are never confused in the store.
#
# This file is NOT research/hypotheses/. Those YAML files are materialised by
# `variants.preregistered_variants()` into runnable settings of an already
# registered strategy; a new claim dropped there would silently become a
# variant of something else. These are new claims with no strategy behind them.
#
# Thresholds are calibrated against the recorded corpus (13,637 symbol
# observations, 2026-07-29..08-05, 15 instruments) rather than chosen for how
# they read. The firing share quoted on each condition block is the measured
# fraction of those observations the block selects. A contract that fires on
# half the corpus is not a claim about anything, and one that fires on nothing
# occupies a research lane for weeks while measuring zero.

version: 1

contracts:
  # ---------------------------------------------------------------------
  - contract_id: funding-crowd-unwind
    status: registered
    author: human-preregistered
    direction: both
    mechanism: |
      Persistent extreme funding is a rent the crowd pays to stay on one side.
      This claim is about the price move that rent predicts, not about
      collecting the rent: when the leveraged side has been paying for long
      enough to be identifiable, its exit is what moves price, and taking the
      other side ahead of that exit is paid in price rather than in
      settlements.
    payer: |
      The leveraged holder who entered late into a persistently one-sided
      funding regime, is paying an above-median rate every interval to keep
      the position, and closes into whatever bid or offer exists when the
      carry cost or an adverse move exhausts their margin. They cannot simply
      stop paying without closing, which is the transaction we are the other
      side of.
    falsifier: |
      Falsified if 24h expectancy on the fixed harness is negative net of
      observed taker costs, or is not distinguishable from the harness
      baseline over the same window. Also falsified if the result exists only
      on the short side, which would mean it is a bull-market artifact rather
      than a crowding effect.
    notes: |
      This is the directional residual of funding-carry, which was rejected as
      a carry claim: over 116 forward trades the price component contributed
      +1.969% against +0.039% from funding itself. That residual was set aside
      at the time as a separate hypothesis needing its own pre-registration.
      It is that pre-registration. The 24h harness is what makes it testable -
      funding-carry's own 240h contract could never reach the sample floor.
      Calibration: funding_percentile_30 >= 80 alone fires on 56.3% of the
      corpus and is therefore not a crowding signal at all; the percentile is
      computed over 30 samples that are frequently pinned. The absolute floor
      is what makes the tail a tail. Measured firing share: 3.4% short,
      1.6% long.
    conditions:
      - {field: funding_percentile_30, op: ">=", value: 90.0, when_direction: short}
      - {field: funding_rate_pct, op: ">=", value: 0.02, when_direction: short}
      - {field: funding_percentile_30, op: "<=", value: 10.0, when_direction: long}
      - {field: funding_rate_pct, op: "<=", value: -0.01, when_direction: long}
      - {field: funding_samples_30, op: ">=", value: 20}

  # ---------------------------------------------------------------------
  - contract_id: oi-buildup-fade
    status: registered
    author: human-preregistered
    direction: both
    mechanism: |
      Open interest rising sharply while price sits at the edge of its recent
      range means new leveraged positions were opened at the worst available
      entry in that range. This is the arrival of the crowd, not its
      departure, so it is measured before any forced flow rather than after.
    payer: |
      The late leveraged entrant who added exposure at the top or bottom of a
      four-hour range. Their stop sits inside the range they just bought the
      edge of, so an ordinary mean reversion of a few tenths of a percent
      forces them out at a price they did not choose. They cannot wait it out
      because the position is levered and the margin is not theirs.
    falsifier: |
      Falsified if 24h expectancy on the fixed harness is negative net of
      observed taker costs, or matches the harness baseline. Also falsified if
      the effect is present only where open interest is small in absolute
      terms, which would make it a thin-instrument artifact rather than a
      claim about crowding.
    notes: |
      Deliberately not flush-fade. That contract fades open-interest DROPS -
      forced exits that have already happened - and was rejected as
      T0_REJECTED. This fades open-interest BUILDS, before the exit, and the
      payer is the entrant rather than the liquidated holder. Calibration:
      oi_change_4h_pct >= 8 is the 93rd percentile of the corpus (p95 = 11.3,
      p99 = 54.4); combined with the range extreme it selects 1.50% of
      observations short and 0.77% long. Adding a relative-volume filter was
      tested and rejected at calibration time: it cuts firing to 0.19%, which
      would not reach the 30-observation screening floor in a month.
    conditions:
      - {field: oi_change_4h_pct, op: ">=", value: 8.0}
      - {field: range_pos_pct, op: ">=", value: 80.0, when_direction: short}
      - {field: range_pos_pct, op: "<=", value: 20.0, when_direction: long}

  # ---------------------------------------------------------------------
  - contract_id: basis-crowd-fade
    status: registered
    author: human-preregistered
    direction: both
    mechanism: |
      The perpetual trades at a premium or discount to its own index when
      leveraged demand on one side exceeds what arbitrage has closed yet. A
      stretched basis is that imbalance made visible, and it is mechanically
      pulled back toward the index by the funding payment it produces.
    payer: |
      The taker paying up through the book to get perpetual exposure now
      rather than at the index price, plus the arbitrage desk on the other
      leg who must be compensated for holding the spread. The first cannot
      wait because the position is the point; the second is paid by the
      convergence we are also positioned for.
    falsifier: |
      Falsified if 24h expectancy on the fixed harness is negative net of
      observed taker costs, or matches the harness baseline. Also falsified
      if basis coverage stays below roughly a third of observations, in which
      case the mechanism is untestable rather than wrong and must be retired
      as starved rather than as negative.
    notes: |
      This is the registered basis-stretch hypothesis, which never fired once
      across the whole corpus because allow_experimental_setups_in_demo was
      false for its entire life. Calibration is the weakest of the three and
      is stated as such: perp_index_basis_pct was null in 12,995 of 13,637
      observations, absent entirely before 2026-08-04, and available on only
      22-34% of observations after the batch mark/index refresh started
      returning data. The thresholds are the 5th and 95th percentiles of the
      642 observations that do exist, which is two days of one regime. Expect
      an early verdict of STARVED_OF_DATA rather than a negative one, and
      re-calibrate the thresholds against a larger sample before reading any
      expectancy off this lane.
    conditions:
      - {field: perp_index_basis_pct, op: ">=", value: 0.5, when_direction: short}
      - {field: perp_index_basis_pct, op: "<=", value: -0.2, when_direction: long}

  # ---------------------------------------------------------------------
  # Deferred entries are parsed and reported but never registered. A staged
  # contract is an immutable claim occupying a research lane, so one that
  # cannot fire is worse than one that is missing: it is indistinguishable in
  # the evidence from a claim that fired and lost.
  - contract_id: liq-absorption-direct
    status: deferred
    deferred_reason: |
      liq_notional_1h_usd is absent from all 13,637 recorded observations, so
      no threshold on it can be calibrated and the field is not confirmed to
      populate in practice. It was added to the forward contract after this
      corpus was recorded, and agent/market.py degrades it to None whenever
      OKX returns no filled liquidations. Register this only after a
      deployment shows the field populated, and set the threshold from that
      distribution.
    author: human-preregistered
    direction: both
    mechanism: |
      Forced liquidation flow is the one order flow in the market that is
      known to be price-insensitive, because the liquidation engine sells at
      whatever is available rather than at a price the holder chose. Standing
      on the other side of a large cluster of it is paid by that
      insensitivity.
    payer: |
      The liquidation engine itself, acting for a holder whose margin is
      exhausted. It has no discretion over price or timing and must complete
      the order, which is precisely why it transacts at levels the holder
      would never accept voluntarily.
    falsifier: |
      Falsified if 24h expectancy on the fixed harness is negative net of
      observed taker costs, or matches the harness baseline. Also falsified
      if the liquidation feed proves too sparse to reach the screening floor,
      in which case it is retired as starved rather than as negative.
    notes: |
      Re-tests flush-fade's mechanism against the direct measurement instead
      of the open-interest proxy that rejected it. The registry note on that
      rejection reads "the mechanism remains plausible; this parameterisation
      of it does not survive", and the proxy was the parameterisation. The
      100000 USD threshold below is a placeholder and must be replaced from
      an observed distribution before this is registered.
    conditions:
      - {field: liq_notional_1h_usd, op: ">=", value: 100000.0}
      - {field: atr_1h_ratio, op: ">=", value: 1.3}
      - {field: mom_1h_pct, op: "<", value: 0.0, when_direction: long}
      - {field: mom_1h_pct, op: ">", value: 0.0, when_direction: short}
