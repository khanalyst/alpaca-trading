# Named parameter variants. The attribution key for every recorded result.
#
# A variant states one claim about one set of parameters. The hypothesis field
# is required and is not decoration: at these sample sizes something always
# looks best, and a table of rankings with no claim written beforehand is a
# ranking of noise.
#
# Registration does not schedule execution. Parameter sweeps wait for the
# funnel report because a downstream binding veto would make contract settings
# unable to change trade count. Conditioning axes run before parameter axes:
# they partition existing trades instead of dividing a small sample further.

variants:
  # Immutable coupled tuning identity from the ls-ratio-fade forward run.
  # It deliberately changes multiple executable fields and therefore is not
  # emitted by the one-axis research selector.
  - variant_id: ls_ratio_fade.tuned_70_30_ext_1_5_stop_1_target_3
    strategy_id: ls-ratio-fade
    base_version: v1
    overrides:
      strategy.ls_high_percentile: 70.0
      strategy.ls_low_percentile: 30.0
      strategy.hard_max_entry_extension_atr: 1.5
      strategy.min_stop_atr_multiple: 1.0
      strategy.fixed_reward_risk: 3.0
    hypothesis: >-
      The coupled 70/30 positioning tails, 1.5 ATR extension cap, 1 ATR
      minimum stop and 3R target are the exact tuned semantics measured in
      the forward run; this identity is not a one-axis experiment.
    status: testing

  - variant_id: momentum.baseline
    strategy_id: momentum
    base_version: phase1-v3
    overrides: {}
    hypothesis: >-
      The configuration as shipped. The comparison floor for every other
      variant of this strategy, and the arm the replay must reproduce before
      any other number here means anything.
    status: testing

  # Exit policy
  # findings.md: the 2R target has never been validated against any
  # alternative. Three settings minimum before this axis may be rejected.
  # Retired 2026-08-05 on live demo evidence, status only; the registered
  # claims stay as written. Over 2026-07-29..08-05 the momentum order path
  # closed 35 trades for 4 wins (11.4%) at -0.974% per trade, taking the demo
  # account from 71,099 to 64,720. At a 3.0R target breakeven needs about 25%
  # wins. That is consistent with the 2024-2026 audit, where 0 of 79
  # walk-forward variants were positive out of sample and both random entry
  # timing and the inverted signal beat the contract at zero cost.
  #
  # Reward:risk, stop distance and net-direction caps all tune the sizing of
  # a contract whose directional edge measures negative, so each arm would
  # occupy a research lane for weeks to re-measure a settled result. The
  # momentum.hyp.* arms are deliberately NOT retired: those test three
  # independent registered mechanisms that merely run on this lane, and they
  # have never fired at all because experimental setups were disabled.
  - variant_id: momentum.rr.fixed_1_5
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.fixed_reward_risk: 1.5
    hypothesis: >-
      A 1.5R target trades a lower average win for a higher hit rate, and at
      this cost ratio the higher hit rate wins.
    status: superseded

  # The claim below names 2.0R as "the default" because that is what shipped
  # when this arm was registered; the shipped target is now 3.0R. The text is
  # deliberately NOT corrected in place: hypothesis is part of the immutable
  # experiment identity in findings.db, so editing it makes every command that
  # registers this registry abort, and - the reason the rule exists - a claim
  # that can be reworded after the fact cannot be told apart from one
  # retro-fitted to the result. The arm itself is unchanged: fixed_reward_risk
  # 2.5 against whatever the baseline ships. To restate the comparison,
  # register a new variant_id.
  - variant_id: momentum.rr.fixed_2_5
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.fixed_reward_risk: 2.5
    hypothesis: >-
      A 2.5R fixed target outperforms the default 2.0R because the default was
      chosen by convention rather than measured.
    status: superseded

  - variant_id: momentum.rr.fixed_2_0
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.fixed_reward_risk: 2.0
    hypothesis: >-
      A 2.0R target converts more excursions into wins than the shipped 3.0R
      target, and the higher hit rate outweighs the truncated right tail.
    status: superseded

  # Superseded because 3.0R is now the shipped baseline, so this arm duplicates
  # momentum.baseline and is not an independent comparison. Only the status is
  # changed: status is the one mutable field, and rewriting the registered
  # claim to say so would break the identity the results are attributed to.
  - variant_id: momentum.rr.fixed_3_0
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.fixed_reward_risk: 3.0
    hypothesis: >-
      A 3.0R target captures the tail that a 2R target truncates, and the tail
      is where a momentum strategy's expectancy lives if it has any.
    status: superseded

  # Noise floor
  # min_stop_atr_multiple sets how much ordinary movement counts as
  # invalidation, so it drives stop distance, position size and R together.
  - variant_id: momentum.stop.atr_1_25
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.min_stop_atr_multiple: 1.25
    hypothesis: >-
      A modestly wider 1.25 ATR floor removes ordinary-noise stop-outs without
      paying the full position-size and target-distance cost of a 1.5 ATR stop.
    status: superseded

  - variant_id: momentum.stop.atr_1_5
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.min_stop_atr_multiple: 1.5
    hypothesis: >-
      A 1.0 ATR stop sits inside ordinary noise, so a materially wider floor
      converts stop-outs into trades that were right but too early.
    status: superseded

  - variant_id: momentum.stop.atr_2_0
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.min_stop_atr_multiple: 2.0
    hypothesis: >-
      The same claim at twice the default, to establish whether the effect is
      monotonic or has an interior optimum.
    status: superseded

  # Net-direction veto
  # findings.md section 5 flags the net-direction cap as the step that kills
  # most 2nd and 3rd same-side entries. Gate G4 promotes this to first
  # priority if the funnel confirms it dominates.
  - variant_id: momentum.net_direction.60
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.max_net_direction_pct: 60
    hypothesis: >-
      Tightening the net-direction cap costs little, because the entries it
      refuses are correlated expressions of one market-wide move rather than
      independent trades.
    status: superseded

  - variant_id: momentum.net_direction.80
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.max_net_direction_pct: 80
    hypothesis: >-
      An 80 percent net-direction cap removes the most correlated marginal
      entry while retaining more independent opportunities than the 60 cap.
    status: superseded

  - variant_id: momentum.net_direction.120
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.max_net_direction_pct: 120
    hypothesis: >-
      A looser 120 percent cap reveals whether the shipped 100 percent ceiling
      suppresses genuinely independent signals rather than correlated bets.
    status: superseded

  # Confidence floor
  # The live prompt already suppresses proposals below the shipped 0.65
  # floor. Reusing recorded proposals can therefore measure only the marginal
  # value of stricter floors, not the value of proposals the model never emits.
  - variant_id: momentum.conf.floor_0_50
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.50
    hypothesis: >-
      This historical lower-floor candidate is superseded because the live
      prompt suppresses the low-confidence proposals it would need to observe.
    status: superseded

  - variant_id: momentum.conf.floor_0_55
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.55
    hypothesis: >-
      This historical lower-floor candidate is superseded because the live
      prompt suppresses the low-confidence proposals it would need to observe.
    status: superseded

  - variant_id: momentum.conf.floor_0_60
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.60
    hypothesis: >-
      This historical lower-floor candidate is superseded because the live
      prompt suppresses the low-confidence proposals it would need to observe.
    status: superseded

  # RETIRED 2026-08-04 on live demo evidence. Confidence is anti-informative
  # in the band these arms test. Over 24 demo round trips:
  #
  #   0.00-0.70   9 trades  22.2% win  -0.41R
  #   0.70-0.80  13 trades   0.0% win  -0.52R   <- 0 for 13
  #   0.80-0.90   1 trade   100.0% win +0.04R
  #
  # The model's HIGHER-confidence bucket lost every trade and scored worse
  # per trade than its lower-confidence bucket. Raising the floor to 0.70
  # selects the 0-for-13 population, so these three arms would spend ~30 days
  # each measuring an axis that runs the wrong way. Status only is advanced;
  # the registered claims stay as written.

  - variant_id: momentum.conf.floor_0_70
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.70
    hypothesis: >-
      A 0.70 floor measures whether a modestly stricter confidence gate adds
      marginal value over the observable proposals admitted by the 0.65 baseline.
    status: superseded

  - variant_id: momentum.conf.floor_0_75
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.75
    hypothesis: >-
      A 0.75 floor measures whether a materially stricter confidence gate adds
      marginal value over the observable proposals admitted by the 0.65 baseline.
    status: superseded

  - variant_id: momentum.conf.floor_0_80
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      risk.min_confidence: 0.80
    hypothesis: >-
      A 0.80 floor measures whether the strictest registered confidence gate
      adds marginal value over the observable proposals admitted by the 0.65 baseline.
    status: superseded

  # Breakout discriminator
  # The two contracts overlap, so attribution splits one phenomenon across
  # two rows. What they should be separated BY is the open question, and the
  # plan and the edge hypotheses give different answers. Registering both as
  # variants is what lets the corpus decide instead of the argument.
  #
  # Neither discriminator is preselected, so each population remains
  # observable while the parameter is evaluated.
  #
  # RETIRED 2026-08-04: unrunnable, not refuted. Separating breakouts from
  # continuations needs a breakout population, and live demo produced 2
  # range_breakout trades against 21 trend_continuation in 24 round trips.
  # funding_squeeze produced 0. Momentum is operationally a one-setup
  # strategy, so neither discriminator can be measured on this feed. Revisit
  # only if breakout frequency rises materially.
  - variant_id: momentum.discriminator.trend_alignment
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.breakout_discriminator: trend_alignment
    hypothesis: >-
      A breakout is a transition out of chop, so requiring the absence of
      prior multi-timeframe alignment separates it from a continuation
      without losing real breakouts.
    status: superseded

  - variant_id: momentum.discriminator.volatility_regime
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      strategy.breakout_discriminator: volatility_regime
    hypothesis: >-
      The real partition is compression versus expansion, and trend alignment
      is a correlated proxy for it. A breakout from a compressed base is an
      event; a break when volatility is already elevated is an ordinary
      excursion in a distribution that is already wide.
    status: superseded

  # Conditioning axes
  # Everything above this line is a parameter axis, which is the reverse of
  # the order this file's header states. research/sweep.py defines the
  # difference: a parameter axis generates variants and divides the sample; a
  # conditioning axis carries no config override, so one replay produces every
  # bucket out of trades that already exist.
  #
  # Empty overrides are the registration, not an omission.
  # declared_research_setting() returns None for a variant with no single
  # declared setting, so agent/shadow.py leaves these out of the rotation and
  # agent/variants.research_selection_catalog() leaves them out of the selector.
  # They cost no arm and no calendar: they are scored by partitioning the
  # baseline's executed decisions with sweep.partition().
  #
  # Boundaries are not restated here. Each claim names the spec under
  # research/sweeps/ that fixed its buckets before any query was run, so the
  # registered identity and the pre-registration cannot drift apart.
  #
  # Checked before choosing the variables: sweep conditioning reads
  # ReplayDecision.enrichment, which carries the withheld enrichment block and
  # nothing else. realised_vol_ratio_8_96 and utc_hour are in it.
  # funding_percentile_30, range_pos_pct and trend_1h/trend_4h are ordinary
  # snapshot fields that never reach a decision record, so a variant
  # conditioned on one of them would bucket zero trades while looking like a
  # registered test.
  - variant_id: momentum.cond.vol_regime
    strategy_id: momentum
    base_version: phase1-v3
    overrides: {}
    hypothesis: >-
      Momentum expectancy has opposite signs either side of the volatility
      regime, so the pooled figure is the average of two populations and lands
      near zero. Partition executed trades on realised_vol_ratio_8_96 into the
      compression, neutral and expansion buckets pre-registered in
      research/sweeps/regime_conditioning.yaml. Mechanism: the stop is a fixed
      ATR multiple measured at entry, so out of a compressed base the move that
      follows is large against that distance, while when volatility is already
      elevated the same distance sits inside ordinary noise and the trade exits
      on movement that carries no directional information. Falsified if
      compression and expansion expectancy differ by less than the
      family-corrected MDE at 100 round trips per bucket.
    status: candidate

  - variant_id: momentum.cond.session
    strategy_id: momentum
    base_version: phase1-v3
    overrides: {}
    hypothesis: >-
      Momentum expectancy is not uniform across the UTC day and entries taken
      in thin liquidity are disproportionately stop-runs. Partition executed
      trades on utc_hour into the asia, thin_hours, europe_us_overlap and
      off_hours windows pre-registered in
      research/sweeps/session_conditioning.yaml. Mechanism: a breakout is only
      information when the level is taken by size the book had to absorb; in
      the thinnest hours ordinary flow pushes price through the level and back,
      so the entry prices a liquidity artefact rather than a repricing.
      Falsified if thin_hours expectancy does not fall below the pooled figure
      by more than the family-corrected MDE at 100 round trips per window, and
      no result here may be quoted before it survives the out-of-sample split
      that spec requires.
    status: candidate

  # Universe breadth
  # top_n has been fixed at 10 since the first config and has never been an
  # axis, although "does the edge live in the liquid majors or in the tail" is
  # a real question with opposite answers registered below.
  #
  # Unlike every other axis in this file, top_n is not a contract parameter.
  # It changes which symbols the contract is ever shown, so it sits upstream of
  # the veto the funnel finding placed downstream of the strategy contract -
  # the one reason no contract parameter can move the trade count.
  #
  # agent/variants.apply() accepts universe.* unchanged: the path exists in the
  # base config, _set_dotted sets it, and validate_config accepts 5, 10 and 25.
  # Nothing in the override machinery had to change.
  #
  # What is NOT yet true is that the research layer can measure it. Neither
  # research/replay.py nor agent/shadow.py re-selects the universe: both
  # consume the symbol set agent/market.select_universe already chose live, so
  # a top_25 arm sees no extra symbol and a top_5 arm is not narrowed. README
  # already lists select_universe feedback as a known replay limit.
  #
  # So the claims are registered and the status is not `candidate`. That is not
  # a softening: `candidate` is what schedules. A candidate single-axis variant
  # enters research_selection_catalog(), and brain.research_selection_prompt_
  # fragment() lists every catalogued variant_id verbatim in the live system
  # prompt - registering these two as candidates moved prompt_version from
  # 608188bfb1314d2e to 3008b9474b77437d. Forking prompt attribution buys
  # nothing while no research path can execute the axis, and it would spend a
  # ten-day rotation slot on an arm guaranteed to return the baseline's own
  # numbers. This is the same disposition the discriminator arms above carry:
  # unrunnable, not refuted.
  #
  # Two things advance these to `candidate`, and both belong to one batch: the
  # recorder must record a wider universe than the agent trades, so that 5 is a
  # strict subset and 25 has something to see; and prompt_version must be
  # re-pinned deliberately in tests/research/test_enrichment_isolation.py,
  # forking attribution on purpose.
  - variant_id: momentum.universe.top_5
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      universe.top_n: 5
    hypothesis: >-
      The edge lives in the liquid majors. Restricting the universe to the five
      highest-volume USDT perpetuals raises expectancy per trade even though it
      cuts the trade count, because spread, depth and stop slippage are a fixed
      charge against a 1.5 percent risk budget and they fall fastest with
      volume. Falsified if expectancy at top_n 5 does not exceed the shipped 10
      by more than the MDE at 100 round trips per setting.
    status: superseded

  # The shipped universe moved from 10 to 25 on 2026-08-05, which left this
  # axis with only two distinct points because top_25 became the baseline.
  # The previous shipped breadth is registered here as the third so the axis
  # can still conclude. Its claim is written against the new baseline; the
  # older rows keep their original wording because a registered hypothesis is
  # immutable identity.
  - variant_id: momentum.universe.top_10
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      universe.top_n: 10
    hypothesis: >-
      Restricting the universe from the shipped 25 back to the ten
      highest-volume USDT perpetuals raises expectancy per trade, because
      spread, depth and stop slippage are a fixed charge against the risk
      budget and fall fastest with volume. Falsified if expectancy at top_n 10
      does not exceed the shipped 25 by more than the MDE at 100 round trips
      per setting.
    status: superseded

  - variant_id: momentum.universe.top_25
    strategy_id: momentum
    base_version: phase1-v3
    overrides:
      universe.top_n: 25
    hypothesis: >-
      The edge lives in the tail. Widening the universe to twenty-five
      instruments raises expectancy because the momentum contract competes with
      fewer participants outside the majors, and the added cost drag is smaller
      than the wider signal it buys. This is the opposite claim to
      momentum.universe.top_5 and one of the two must lose. Falsified if
      expectancy at top_n 25 does not exceed the shipped 10 by more than the
      MDE at 100 round trips per setting.
    status: superseded
