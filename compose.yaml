name: alpaca-agent-trading

x-app: &app
  image: alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${ALPACA_PYTHON_IMAGE:-python:3.13.5-slim-bookworm}
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
  user: "10001:10001"
  working_dir: /app
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  recorder:
    <<: *app
    container_name: alpaca-recorder
    command:
      - python
      - deploy/recorder.py
      - --out
      - runtime/research/recorded
      - --interval
      - ${ALPACA_RECORDER_INTERVAL_SECONDS:-30}
    environment:
      ALPACA_AGENT_SECRETS_FILE: /run/secrets/agent_credentials
      ALPACA_PAPER: "true"
      ALPACA_LIVE_ENABLE: "false"
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_STOCK_FEED: ${ALPACA_STOCK_FEED:-iex}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      ALPACA_RECORDER_OPTION_LIMIT: ${ALPACA_RECORDER_OPTION_LIMIT:-10}
      ALPACA_RECORDER_OPTION_HOLD_MINUTES: ${ALPACA_RECORDER_OPTION_HOLD_MINUTES:-180}
      ALPACA_RECORDER_FETCH_WINDOW_MINUTES: ${ALPACA_RECORDER_FETCH_WINDOW_MINUTES:-1}
      ALPACA_RECORDER_FORWARD_OBSERVATION_MAX_LAG_MINUTES: ${ALPACA_RECORDER_FORWARD_OBSERVATION_MAX_LAG_MINUTES:-15}
      ALPACA_RECORDER_BAR_GAP_MINUTES: ${ALPACA_RECORDER_BAR_GAP_MINUTES:-5}
      ALPACA_RECORDER_STRICT_BAR_FEEDS: "${ALPACA_RECORDER_STRICT_BAR_FEEDS:-}"
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    secrets:
      - source: agent_credentials
        target: agent_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - runtime-data:/app/runtime
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "recorder", "--config", "config.yaml", "--max-age", "300"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 45s

  trader:
    <<: *app
    container_name: alpaca-trader
    command: ["python", "main.py", "run"]
    environment:
      ALPACA_AGENT_SECRETS_FILE: /run/secrets/agent_credentials
      ALPACA_PAPER: "true"
      ALPACA_LIVE_ENABLE: "false"
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_STOCK_FEED: ${ALPACA_STOCK_FEED:-iex}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    secrets:
      - source: agent_credentials
        target: agent_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime
      - research-cache:/app/research/cache
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "trader", "--config", "config.yaml", "--max-age", "240"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    cpus: "1.50"
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 2m
    deploy:
      replicas: 1

  watchdog:
    <<: *app
    container_name: alpaca-watchdog
    # A separate container with its own broker session, so it cannot die with
    # the trader it watches.  It can only cancel and flatten; the mode-scoped
    # run lock on the shared runtime volume keeps it inert while the trader
    # lives.
    command:
      - python
      - deploy/watchdog.py
      - --config
      - config.yaml
      - --interval
      - ${ALPACA_WATCHDOG_INTERVAL_SECONDS:-30}
      - --max-heartbeat-age
      - ${ALPACA_WATCHDOG_MAX_HEARTBEAT_AGE:-300}
    environment:
      ALPACA_AGENT_SECRETS_FILE: /run/secrets/agent_credentials
      ALPACA_PAPER: "true"
      ALPACA_LIVE_ENABLE: "false"
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_STOCK_FEED: ${ALPACA_STOCK_FEED:-iex}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    secrets:
      - source: agent_credentials
        target: agent_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "watchdog", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m
    cpus: "0.25"
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 45s
    deploy:
      replicas: 1

  research:
    <<: *app
    container_name: alpaca-research
    command:
      - python
      - deploy/scheduler.py
      - --hour
      - "3"
      - --minute
      - "0"
      - --timeout-seconds
      - ${ALPACA_RESEARCH_TIMEOUT_SECONDS:-14400}
      - --script
      - deploy/research-cycle.sh
    environment:
      ALPACA_PAPER: "true"
      ALPACA_RESEARCH_LLM_SECRETS_FILE: /run/secrets/research_llm_credentials
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_STOCK_FEED: ${ALPACA_STOCK_FEED:-iex}
      ALPACA_OPTIONS_FEED: ${ALPACA_OPTIONS_FEED:-indicative}
      # Scheduled research follows the deployed shares/equity lane by default.
      # Set ALPACA_RESEARCH_VEHICLES=all (or option) to opt into other lanes.
      ALPACA_RESEARCH_VEHICLES: ${ALPACA_RESEARCH_VEHICLES:-equity}
      ALPACA_RESEARCH_DATASET: ${ALPACA_RESEARCH_DATASET:-}
      # A fresh Compose deployment has no paper execution journal yet.  The
      # explicit bootstrap state permits broker-free shadow evidence collection
      # only; its persisted calibration authorization_exit_code remains 2.
      # Set to 0 when measured calibration must exist before shadow ingestion.
      ALPACA_RESEARCH_CALIBRATION_BOOTSTRAP_UNKNOWN: ${ALPACA_RESEARCH_CALIBRATION_BOOTSTRAP_UNKNOWN:-1}
      ALPACA_RESEARCH_BACKTEST: ${ALPACA_RESEARCH_BACKTEST:-1}
      ALPACA_FACTORY_ENABLED: ${ALPACA_FACTORY_ENABLED:-1}
      ALPACA_FACTORY_STRATEGIES: ${ALPACA_FACTORY_STRATEGIES:-12}
      ALPACA_FACTORY_VARIANTS: ${ALPACA_FACTORY_VARIANTS:-4}
      ALPACA_FACTORY_WORKERS: ${ALPACA_FACTORY_WORKERS:-2}
      ALPACA_FACTORY_STARTING_CASH: ${ALPACA_FACTORY_STARTING_CASH:-100000}
      ALPACA_FACTORY_MIN_TRADES: ${ALPACA_FACTORY_MIN_TRADES:-100}
      ALPACA_FACTORY_MIN_SESSIONS: ${ALPACA_FACTORY_MIN_SESSIONS:-30}
      ALPACA_FACTORY_ALPHA: ${ALPACA_FACTORY_ALPHA:-0.05}
      ALPACA_RESEARCH_SESSION_WINDOW: ${ALPACA_RESEARCH_SESSION_WINDOW:-0}
      # Cache reuse is opt-in per immutable corpus snapshot. The identity must
      # cover the selected partition bytes and provenance/calendar sidecars.
      ALPACA_RESEARCH_IMMUTABLE_SOURCE_IDENTITY: ${ALPACA_RESEARCH_IMMUTABLE_SOURCE_IDENTITY:-}
      ALPACA_RESEARCH_PREPROCESSING_CACHE_ROOT: ${ALPACA_RESEARCH_PREPROCESSING_CACHE_ROOT:-/app/research/cache/preprocessing}
      # Historical catch-up may run the model-assisted diagnostic factory, but
      # never the authorizing edge ledger or shadow-ingestion path.
      ALPACA_FACTORY_DIAGNOSTIC_ONLY: ${ALPACA_FACTORY_DIAGNOSTIC_ONLY:-0}
      ALPACA_FACTORY_DIAGNOSTIC_REPORT: ${ALPACA_FACTORY_DIAGNOSTIC_REPORT:-/app/runtime/research/diagnostics/factory-%s-latest.json}
      TMPDIR: ${ALPACA_RESEARCH_TMPDIR:-/app/research/cache/tmp}
      ALPACA_FACTORY_MAX_GENERATIONS: ${ALPACA_FACTORY_MAX_GENERATIONS:-5}
      ALPACA_EDGE_DB: ${ALPACA_EDGE_DB:-runtime/research/edge_lab.sqlite3}
      ALPACA_SHADOW_DB: ${ALPACA_SHADOW_DB:-/app/shadow/shadow.sqlite3}
      ALPACA_SHADOW_INGEST_ENABLED: ${ALPACA_SHADOW_INGEST_ENABLED:-1}
      ALPACA_SHADOW_MIN_TRADES: ${ALPACA_SHADOW_MIN_TRADES:-150}
      ALPACA_SHADOW_MIN_SESSIONS: ${ALPACA_SHADOW_MIN_SESSIONS:-30}
      PYTHON: /usr/local/bin/python
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    secrets:
      - source: research_llm_credentials
        target: research_llm_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime
      - research-cache:/app/research/cache
      - research-results:/app/research/results
      # ShadowRunner is the sole writer; research opens this WAL read-only.
      - shadow-data:/app/shadow:ro
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "research", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m
    cpus: "1.50"
    mem_limit: ${ALPACA_RESEARCH_MEMORY_LIMIT:-10g}
    pids_limit: 256
    stop_grace_period: 2m

  shadow-init:
    <<: *app
    container_name: alpaca-shadow-init
    # The application remains least-privilege. This short-lived initializer
    # only repairs the ownership of the persistent WAL directory, then exits.
    user: "0:0"
    read_only: false
    security_opt: []
    cap_drop: []
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    network_mode: none
    restart: "no"
    environment:
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    command:
      - sh
      - -ec
      - |
        mkdir -p /app/shadow
        chown 10001:10001 /app/shadow
        chmod 0770 /app/shadow
    volumes:
      - shadow-data:/app/shadow

  shadow:
    <<: *app
    container_name: alpaca-shadow
    depends_on:
      shadow-init:
        condition: service_completed_successfully
    # This process has no broker credentials and cannot write the recorder or
    # EdgeLedger volumes.  Only its separate WAL database is writable.
    command:
      - python
      - deploy/shadow.py
      - --corpus
      - /app/runtime/research/recorded/market.csv
      - --edge-db
      - /app/runtime/research/edge_lab.sqlite3
      - --shadow-db
      - /app/shadow/shadow.sqlite3
      - --health-file
      - /app/shadow/health.json
      - --interval
      - ${ALPACA_SHADOW_INTERVAL_SECONDS:-60}
      - --retention-days
      - ${ALPACA_SHADOW_RETENTION_DAYS:-180}
    environment:
      ALPACA_SHADOW_RETENTION_DAYS: ${ALPACA_SHADOW_RETENTION_DAYS:-180}
      # Optional, shadow-only calibrated stress overlay. A mounted artifact
      # remains inert unless the explicit enabled switch is true.
      ALPACA_SHADOW_STRESS_CALIBRATION_ENABLED: ${ALPACA_SHADOW_STRESS_CALIBRATION_ENABLED:-0}
      ALPACA_SHADOW_STRESS_CALIBRATION_PATH: ${ALPACA_SHADOW_STRESS_CALIBRATION_PATH:-}
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    volumes:
      - runtime-data:/app/runtime:ro
      - shadow-data:/app/shadow
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "shadow", "--path", "/app/shadow/health.json", "--max-age", "180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s

  dashboard:
    <<: *app
    container_name: alpaca-dashboard
    command: ["python", "deploy/dashboard.py", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      ALPACA_EDGE_DB: ${ALPACA_EDGE_DB:-runtime/research/edge_lab.sqlite3}
      ALPACA_DEPLOYMENT_COMMIT: ${ALPACA_DEPLOYMENT_COMMIT:-unknown}
      ALPACA_DEPLOYMENT_IMAGE: ${ALPACA_DEPLOYMENT_IMAGE:-alpaca-agent-trading:${ALPACA_AGENT_IMAGE_TAG:-local}}
      ALPACA_DEPLOYMENT_IMAGE_DIGEST: ${ALPACA_DEPLOYMENT_IMAGE_DIGEST:-}
    ports:
      - "127.0.0.1:${ALPACA_DASHBOARD_PORT:-8080}:8080"
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime:ro
      - research-cache:/app/research/cache:ro
      - research-results:/app/research/results:ro
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s

configs:
  agent_config:
    file: ./config.yaml

secrets:
  agent_credentials:
    file: ${ALPACA_AGENT_SECRET_FILE:-.env}
  research_llm_credentials:
    # Research is autonomous in the shipped profile. Do not mount /dev/null
    # and let the cycle silently downgrade; Compose itself requires the
    # separate provider-secret file before this service can start.
    file: ${ALPACA_RESEARCH_LLM_SECRET_FILE:?set ALPACA_RESEARCH_LLM_SECRET_FILE to a readable dotenv file}

volumes:
  runtime-data:
  research-cache:
  research-results:
  shadow-data:
