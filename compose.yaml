name: okx-agent-crypto

x-app: &app
  image: okx-agent-crypto:${OKX_AGENT_IMAGE_TAG:-local}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${OKX_PYTHON_IMAGE:-python:3.13.5-slim-bookworm}
  user: "10001:10001"
  working_dir: /app
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  recorder:
    <<: *app
    container_name: okx-recorder
    command:
      - python
      - research/record_flow.py
      - --out
      - runtime/research/recorded
      - --book-interval
      - ${OKX_RECORDER_INTERVAL_SECONDS:-60}
    volumes:
      - runtime-data:/app/runtime
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "recorder", "--max-age", "300"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 45s

  trader:
    <<: *app
    container_name: okx-trader
    command: ["python", "main.py", "run"]
    depends_on:
      recorder:
        condition: service_healthy
    environment:
      OKX_AGENT_SECRETS_FILE: /run/secrets/agent_credentials
    secrets:
      - source: agent_credentials
        target: agent_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime
      - research-cache:/app/research/cache
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "trader", "--config", "config.yaml", "--max-age", "240"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    cpus: "1.50"
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 2m
    deploy:
      replicas: 1

  research:
    <<: *app
    container_name: okx-research
    command: ["python", "deploy/scheduler.py", "--hour", "3", "--minute", "0"]
    depends_on:
      recorder:
        condition: service_healthy
    environment:
      OKX_AGENT_SECRETS_FILE: /run/secrets/agent_credentials
      PYTHON: /usr/local/bin/python
    secrets:
      - source: agent_credentials
        target: agent_credentials
        uid: "10001"
        gid: "10001"
        mode: 0400
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime
      - research-cache:/app/research/cache
      - research-results:/app/research/results
      - findings-reports:/app/findings
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "research"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m
    cpus: "1.50"
    mem_limit: 3g
    pids_limit: 256
    stop_grace_period: 2m

  dashboard:
    <<: *app
    container_name: okx-dashboard
    command: ["python", "deploy/dashboard.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${OKX_DASHBOARD_PORT:-8080}:8080"
    configs:
      - source: agent_config
        target: /app/config.yaml
        mode: 0444
    volumes:
      - runtime-data:/app/runtime:ro
      - research-cache:/app/research/cache:ro
      - research-results:/app/research/results:ro
      - findings-reports:/app/findings:ro
    healthcheck:
      test: ["CMD", "python", "deploy/health.py", "dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "0.50"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 30s

configs:
  agent_config:
    file: ./config.yaml

secrets:
  agent_credentials:
    file: ${OKX_AGENT_SECRET_FILE:-.env}

volumes:
  runtime-data:
  research-cache:
  research-results:
  findings-reports:
